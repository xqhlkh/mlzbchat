version: '3.8'

services:
  ai-chat:
    build: .
    container_name: ai-chat
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      # 可选: 在 .env 文件中配置以下变量
      # - OPENAI_API_KEY=
      # - OPENAI_BASE_URL=
      # - ANTHROPIC_API_KEY=
      # - SERPAPI_KEY=
      # - GOOGLE_API_KEY=
      # - GOOGLE_CX=
      # - SEARCH_PROVIDER=duckduckgo
    env_file:
      - server/.env
    volumes:
      - /tmp/ai-chat-uploads:/tmp/ai-chat-uploads
    restart: unless-stopped
